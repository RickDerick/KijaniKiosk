[defaults]
inventory = inventory.ini
retry_files_enabled = False
interpreter_python = auto_silent
# Host keys ARE checked, strictly. pipeline.sh writes .known_hosts with each
# VM's real host key (fetched through Multipass) before Ansible connects.
host_key_checking = True

[ssh_connection]
# Pipelining: faster, and lets tasks run as unprivileged users (become_user)
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o UserKnownHostsFile=.known_hosts -o StrictHostKeyChecking=yes
