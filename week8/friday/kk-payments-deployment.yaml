apiVersion: apps/v1
kind: Deployment
metadata:
  name: kk-payments
  labels:
    app: kk-payments
    week: "8"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kk-payments            # must match template labels below
  template:
    metadata:
      labels:
        app: kk-payments          # must match selector above
        version: "1.0.0-a59f2c1"
    spec:
      imagePullSecrets:
        - name: kijani-registry-credentials   # reference only, never the token
      containers:
        - name: kk-payments
          image: docker.io/derickharon/kk-payments:1.0.0-a59f2c1
          ports:
            - containerPort: 3001
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3001"
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
