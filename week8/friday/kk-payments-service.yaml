apiVersion: v1
kind: Service
metadata:
  name: kk-payments-service
  labels:
    app: kk-payments
spec:
  type: NodePort
  selector:
    app: kk-payments        # must match the Deployment's Pod template label
  ports:
    - name: http
      protocol: TCP
      port: 3001            # Service port inside the cluster
      targetPort: 3001      # container port on the Pods
      nodePort: 30001       # external: curl NODE_IP:30001
